<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#D7263D"/>
  <g fill="#FFFFFF">
    <!-- horns hand: index + pinky up, middle + ring folded, thumb across -->
    <rect x="160" y="150" width="192" height="130" rx="46"/>          <!-- palm -->
    <rect x="166" y="42"  width="52"  height="180" rx="26"/>          <!-- index -->
    <rect x="296" y="70"  width="48"  height="160" rx="24"/>          <!-- pinky -->
    <rect x="224" y="118" width="46"  height="70"  rx="23"/>          <!-- middle, folded -->
    <rect x="266" y="124" width="42"  height="66"  rx="21"/>          <!-- ring, folded -->
    <rect x="212" y="188" width="118" height="44"  rx="22" transform="rotate(-18 271 210)"/> <!-- thumb -->
    <rect x="206" y="262" width="100" height="36"/>                   <!-- wrist -->
    <!-- golf cart -->
    <rect x="120" y="318" width="272" height="20" rx="8"/>            <!-- roof -->
    <rect x="146" y="336" width="14"  height="72"/>                   <!-- rear post -->
    <rect x="352" y="336" width="14"  height="72"/>                   <!-- front post -->
    <rect x="290" y="352" width="18"  height="56" rx="6"/>            <!-- seat back -->
    <rect x="212" y="380" width="96"  height="22" rx="7"/>            <!-- seat -->
    <path d="M96 404 h300 q22 0 30 20 l8 22 q2 12 -10 12 H86 q-12 0 -10 -12 l6 -30 q2 -12 14 -12z"/> <!-- body -->
  </g>
  <g fill="#FFFFFF" stroke="#D7263D" stroke-width="10">
    <circle cx="164" cy="458" r="30"/>
    <circle cx="352" cy="458" r="30"/>
  </g>
  <circle cx="164" cy="458" r="9" fill="#D7263D"/>
  <circle cx="352" cy="458" r="9" fill="#D7263D"/>
</svg>
